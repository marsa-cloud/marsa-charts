apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: marsa-ingress-route
spec:
  entryPoints:
    - web
    - websecure # If TLS is not enabled Traefik default certificate will be used
  routes:
  {{- with .Values.tls.domain }}
  - match: Host(`{{ . }}`)
    kind: Rule
    services:
    - name: marsa-web
      port: 80
  - match: Host(`api.{{ . }}`)
    kind: Rule
    services:
    - name: marsa-api
      port: 3000
  {{- end }}
  - match: PathPrefix(`/`)
    kind: Rule
    services:
    - name: marsa-web
      port: 80
{{- if .Values.tls.enabled }}
  tls:
    certResolver: le
{{- end }}
{{- with .Values.tls.domain }}
---
# Pull-only and HTTPS-only: nodes pull here, pushes stay on the in-cluster Service.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: marsa-registry
spec:
  entryPoints:
    - websecure
  routes:
  - match: Host(`registry.{{ . }}`) && (Method(`GET`) || Method(`HEAD`))
    kind: Rule
    services:
    - name: marsa-registry
      port: 5000
{{- if $.Values.tls.enabled }}
  tls:
    certResolver: le
{{- end }}
{{- end }}
