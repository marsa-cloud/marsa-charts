{{- /*
  Single source of truth for the Postgres passwords.
  Precedence: existing Secret (reuse — preserves auth against the persisted
  PVC on upgrade) > explicit values.yaml override > auto-generated random.
  randAlphaNum is alphanumeric-only, so the values are safe to interpolate
  into SQL and connection strings without quoting/escaping.
*/}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace "postgres-secrets" }}
{{- $admin := .Values.postgres.adminPassword | default (randAlphaNum 24) }}
{{- $marsa := .Values.postgres.marsaUserPassword | default (randAlphaNum 24) }}
{{- if $existing }}
{{- $admin = index $existing.data "POSTGRES_PASSWORD" | b64dec }}
{{- $marsa = index $existing.data "MARSA_PASSWORD" | b64dec }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secrets
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ $admin | quote }}
  MARSA_PASSWORD: {{ $marsa | quote }}