{{- /*
  App-level secret keys the api requires (env.config.ts).
  Generate-once / reuse-on-upgrade — same precedence model as postgres-secrets:
  existing Secret (reuse) > auto-generated random. These keys must NOT rotate on
  upgrade: rotating APP_SECRETS_ENCRYPTION_KEY makes stored GitHub-App secrets
  unrecoverable (AgDR-0006), and rotating AUTH_SESSION_SECRET_KEY invalidates
  every active session cookie. They are intentionally not exposed in values.yaml.
*/}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace "marsa-api-secrets" }}
{{- $appKey := randBytes 32 }}
{{- $sessionKey := randBytes 32 }}
{{- if $existing }}
{{- $appKey = index $existing.data "APP_SECRETS_ENCRYPTION_KEY" | b64dec }}
{{- $sessionKey = index $existing.data "AUTH_SESSION_SECRET_KEY" | b64dec }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: marsa-api-secrets
type: Opaque
stringData:
  APP_SECRETS_ENCRYPTION_KEY: {{ $appKey | quote }}
  AUTH_SESSION_SECRET_KEY: {{ $sessionKey | quote }}
