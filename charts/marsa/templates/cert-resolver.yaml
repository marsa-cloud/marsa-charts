{{- if .Values.tls.enabled }}
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  # MUST be name=traefik in namespace=kube-system: K3s applies a HelmChartConfig
  # only when it matches the bundled `traefik` HelmChart's name + namespace.
  # A differently-named/namespaced config is silently ignored (this is why the
  # resolver wasn't taking effect). NOT the release namespace.
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    additionalArguments:
      - "--certificatesresolvers.le.acme.email={{ .Values.email }}"
      - "--certificatesresolvers.le.acme.storage=/data/acme.json"
      - "--certificatesresolvers.le.acme.tlschallenge=true"
      - "--certificatesresolvers.le.acme.caServer=https://acme-v02.api.letsencrypt.org/directory"
{{- end }}
