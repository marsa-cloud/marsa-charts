apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
data:
  init.sh: |
    #!/bin/sh
    set -e
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" <<-EOSQL
      CREATE USER marsa WITH PASSWORD '${MARSA_PASSWORD}';
      CREATE DATABASE marsa OWNER marsa;
    EOSQL
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: marsa-config
data:
  NODE_ENV: "production"
  DB_NAME: "marsa"
