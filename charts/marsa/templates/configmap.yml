{{- $scheme := ternary "https" "http" .Values.tls.enabled -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
data:
  init.sh: |
    #!/bin/sh
    set -e
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" <<-EOSQL
      CREATE USER marsa WITH PASSWORD '${MARSA_PASSWORD}';
      CREATE DATABASE marsa OWNER marsa;
    EOSQL
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: marsa-config
data:
  NODE_ENV: "production"
  DB_NAME: "marsa"
  MARSA_WEB_URL: "{{ $scheme }}://{{ .Values.tls.domain }}"
  MARSA_API_PUBLIC_URL: "{{ $scheme }}://api.{{ .Values.tls.domain }}"
  # Scheme-less on purpose: the api builds `<slug>.<domain>` app hosts and
  # prepends https:// itself, and Joi validates this as a bare hostname.
  MARSA_BASE_DOMAIN: "{{ .Values.tls.domain }}"
