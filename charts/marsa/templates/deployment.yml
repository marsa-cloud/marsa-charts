apiVersion: apps/v1
kind: Deployment
metadata:
  name: marsa-web
  labels:
    app: marsa-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: marsa-web
  template:
    metadata:
      labels:
        app: marsa-web
    spec:
      containers:
      - name: marsa-web
        image: "ghcr.io/marsa-cloud/marsa-web:{{ .Values.image.tag | default .Chart.AppVersion }}"
        ports:
        - containerPort: 80
        env:
        - name: API_UPSTREAM
          value: "http://marsa-api:3000"
        # `/` is served from nginx's static root, not proxied, so these probes
        # stay green while marsa-api is down. Never point them at /api/.
        readinessProbe:
          httpGet:
            path: /
            port: 80
          periodSeconds: 5
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /
            port: 80
          periodSeconds: 15
          failureThreshold: 3

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: marsa-api
  labels:
    app: marsa-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: marsa-api
  template:
    metadata:
      labels:
        app: marsa-api
    spec:
      serviceAccountName: marsa-api
      containers:
      - name: marsa-api
        image: "ghcr.io/marsa-cloud/marsa-api:{{ .Values.image.tag | default .Chart.AppVersion }}"
        ports:
        - containerPort: 3000
        envFrom:
        - configMapRef:
            name: marsa-config
        - secretRef:
            name: marsa-api-secrets
        env:
        - name: MARSA_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secrets
              key: MARSA_PASSWORD
        - name: DATABASE_URL
          value: "postgresql://marsa:$(MARSA_PASSWORD)@postgres:5432/marsa"
        # /api/v1/status is @Public() and returns static info with no DB access.
        # Liveness MUST stay DB-free: if the endpoint ever grows a Postgres check,
        # a DB blip would restart every api pod. Give readiness its own endpoint
        # for that instead.
        #
        # The api runs migrations before it listens, so the startup probe allows
        # up to 3 minutes (36 x 5s) for boot. Readiness and liveness only start
        # once it passes, which keeps liveness strict after boot.
        startupProbe:
          httpGet:
            path: /api/v1/status
            port: 3000
          periodSeconds: 5
          failureThreshold: 36
        readinessProbe:
          httpGet:
            path: /api/v1/status
            port: 3000
          periodSeconds: 5
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /api/v1/status
            port: 3000
          periodSeconds: 15
          timeoutSeconds: 3
          failureThreshold: 3
