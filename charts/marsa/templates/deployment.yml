apiVersion: apps/v1
kind: Deployment
metadata:
  name: marsa-web
  labels:
    app: marsa-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: marsa-web
  template:
    metadata:
      labels:
        app: marsa-web
    spec:
      containers:
      - name: marsa-web
        image: "ghcr.io/marsa-cloud/marsa-web:{{ .Values.image.tag | default .Chart.AppVersion }}"
        ports:
        - containerPort: 80
        env:
        - name: API_UPSTREAM
          value: "http://marsa-api:3000"
        readinessProbe:
          httpGet:
            path: /
            port: 80
          periodSeconds: 5
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /
            port: 80
          periodSeconds: 15
          failureThreshold: 3

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: marsa-api
  labels:
    app: marsa-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: marsa-api
  template:
    metadata:
      labels:
        app: marsa-api
    spec:
      serviceAccountName: marsa-api
      containers:
      - name: marsa-api
        image: "ghcr.io/marsa-cloud/marsa-api:{{ .Values.image.tag | default .Chart.AppVersion }}"
        ports:
        - containerPort: 3000
        envFrom:
        - configMapRef:
            name: marsa-config
        - secretRef:
            name: marsa-api-secrets
        env:
        - name: MARSA_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secrets
              key: MARSA_PASSWORD
        - name: DATABASE_URL
          value: "postgresql://marsa:$(MARSA_PASSWORD)@postgres:5432/marsa"
        - name: MARSA_API_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: MARSA_REGISTRY_PUSH_PASSWORD
          valueFrom:
            secretKeyRef:
              name: marsa-registry-secrets
              key: PUSH_PASSWORD
        - name: MARSA_REGISTRY_PULL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: marsa-registry-secrets
              key: PULL_PASSWORD
        startupProbe:
          httpGet:
            path: /api/v1/status
            port: 3000
          periodSeconds: 5
          failureThreshold: 36
        readinessProbe:
          httpGet:
            path: /api/v1/status
            port: 3000
          periodSeconds: 5
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /api/v1/status
            port: 3000
          periodSeconds: 15
          timeoutSeconds: 3
          failureThreshold: 3
