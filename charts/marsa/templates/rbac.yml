# RBAC granting the marsa-api operator control over tenant-app resources in the
# apps namespace. Namespace-scoped (Role, not ClusterRole) so a marsa-api
# compromise cannot reach the control-plane namespace or cluster scope. Broad
# within marsa-apps by design (AgDR-0007): the operator will grow new deploy
# capabilities and we don't want an RBAC change + chart release for each. The
# rbac.authorization.k8s.io group is deliberately excluded so the SA cannot
# escalate its own privileges.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: marsa-deployer
  namespace: {{ .Values.appsNamespace }}
rules:
  - apiGroups: ["", "apps", "batch", "autoscaling", "networking.k8s.io", "policy"]
    resources: ["*"]
    verbs: ["*"]
  # Traefik CRDs (IngressRoute, Middleware, ...) the operator applies per app.
  - apiGroups: ["traefik.io"]
    resources: ["*"]
    verbs: ["*"]
  # KEDA HTTP add-on CRDs (HTTPScaledObject) the operator applies and deletes per
  # app (marsa#119). The broad-by-design note above does not cover CRDs: apiGroups
  # is an explicit list, so every new API group the operator writes to needs its
  # own rule here and a chart release to go with it.
  - apiGroups: ["http.keda.sh"]
    resources: ["*"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: marsa-deployer
  namespace: {{ .Values.appsNamespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: marsa-deployer
subjects:
  - kind: ServiceAccount
    name: marsa-api
    namespace: {{ .Release.Namespace }}
