# marsa-api creates one namespace per environment (#142) and binds marsa-deployer into each,
# so its write access is exactly the namespaces it manages. marsa-deployer is never bound
# cluster-wide. rbac.authorization.k8s.io stays out of the deployer rules so the SA can't
# escalate; the only RBAC it holds is creating RoleBindings, and `bind` limited to
# marsa-deployer means it can hand out nothing else. admission-policy.yml closes what RBAC
# can't express: which namespaces it may create, delete, or bind into. The per-namespace
# marsa-deployer binding also covers that namespace object itself, so the policy fences its
# subresources (status, finalize) too.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: marsa-deployer
rules:
  - apiGroups: ["", "apps", "batch", "autoscaling", "networking.k8s.io", "policy"]
    resources: ["*"]
    verbs: ["*"]
  # Traefik CRDs (IngressRoute, Middleware, ...) the operator applies per app.
  - apiGroups: ["traefik.io"]
    resources: ["*"]
    verbs: ["*"]
  # Named, not wildcarded: http.keda.sh also holds InterceptorRoute, the add-on's own state (marsa#119).
  - apiGroups: ["http.keda.sh"]
    resources: ["httpscaledobjects"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: marsa-namespace-manager
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "create", "delete"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["rolebindings"]
    verbs: ["get", "create"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles"]
    verbs: ["bind"]
    resourceNames: ["marsa-deployer"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: marsa-namespace-manager
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: marsa-namespace-manager
subjects:
  - kind: ServiceAccount
    name: marsa-api
    namespace: {{ .Release.Namespace }}
---
# Nodes are cluster-scoped, so this cannot ride marsa-deployer: that role is only ever bound
# per namespace by a RoleBinding, which can never grant access to a cluster-scoped resource.
# Read-only and its own role rather than folded into marsa-namespace-manager, so listing nodes
# never travels with the power to create or delete them (marsa-cloud/marsa#143).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: marsa-cluster-reader
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: marsa-cluster-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: marsa-cluster-reader
subjects:
  - kind: ServiceAccount
    name: marsa-api
    namespace: {{ .Release.Namespace }}
