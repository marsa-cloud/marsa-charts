suite: marsa-api RBAC over the namespaces it manages (#142)
templates:
  - templates/serviceaccount.yml
  - templates/rbac.yml
  - templates/deployment.yml
release:
  name: marsa
  namespace: marsa
tests:
  - it: creates a dedicated marsa-api ServiceAccount in the release namespace
    template: templates/serviceaccount.yml
    asserts:
      - isKind:
          of: ServiceAccount
      - equal:
          path: metadata.name
          value: marsa-api

  # ── marsa-deployer: the per-app rules, bound per environment namespace by the api ──
  - it: defines the deployer rules as a ClusterRole
    template: templates/rbac.yml
    documentIndex: 0
    asserts:
      - isKind:
          of: ClusterRole
      - equal:
          path: metadata.name
          value: marsa-deployer

  - it: grants broad verbs over the core + workload API groups
    template: templates/rbac.yml
    documentIndex: 0
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: ['', 'apps', 'batch', 'autoscaling', 'networking.k8s.io', 'policy']
            resources: ['*']
            verbs: ['*']

  - it: grants control over the Traefik CRDs the operator applies per app
    template: templates/rbac.yml
    documentIndex: 0
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: ['traefik.io']
            resources: ['*']
            verbs: ['*']

  - it: grants control over the KEDA HTTPScaledObject only
    template: templates/rbac.yml
    documentIndex: 0
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: ['http.keda.sh']
            resources: ['httpscaledobjects']
            verbs: ['*']
      - lengthEqual:
          path: rules
          count: 3

  # ── marsa-namespace-manager: create/delete namespaces and hand out marsa-deployer only ──
  - it: lets marsa-api manage namespaces and bind nothing but marsa-deployer
    template: templates/rbac.yml
    documentIndex: 1
    asserts:
      - isKind:
          of: ClusterRole
      - equal:
          path: metadata.name
          value: marsa-namespace-manager
      - contains:
          path: rules
          content:
            apiGroups: ['']
            resources: ['namespaces']
            verbs: ['get', 'create', 'delete']
      - contains:
          path: rules
          content:
            apiGroups: ['rbac.authorization.k8s.io']
            resources: ['rolebindings']
            verbs: ['get', 'create']
      - contains:
          path: rules
          content:
            apiGroups: ['rbac.authorization.k8s.io']
            resources: ['clusterroles']
            verbs: ['bind']
            resourceNames: ['marsa-deployer']
      - lengthEqual:
          path: rules
          count: 3

  - it: binds the namespace manager to the marsa-api SA cluster-wide
    template: templates/rbac.yml
    documentIndex: 2
    asserts:
      - isKind:
          of: ClusterRoleBinding
      - equal:
          path: roleRef.name
          value: marsa-namespace-manager
      - equal:
          path: subjects[0].name
          value: marsa-api
      - equal:
          path: subjects[0].namespace
          value: marsa

  - it: renders three ClusterRoles and two ClusterRoleBindings (marsa-deployer is never bound cluster-wide)
    template: templates/rbac.yml
    asserts:
      - hasDocuments:
          count: 5

  # ── Deployment wiring ──
  - it: runs marsa-api under its ServiceAccount and tells it its own namespace
    template: templates/deployment.yml
    documentIndex: 1
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: marsa-api
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MARSA_API_NAMESPACE
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace

  # ── marsa-cluster-reader: node reads for the pin picker (marsa-cloud/marsa#143) ──
  - it: grants marsa-api read-only access to nodes
    template: templates/rbac.yml
    documentIndex: 3
    asserts:
      - isKind:
          of: ClusterRole
      - equal:
          path: metadata.name
          value: marsa-cluster-reader
      - contains:
          path: rules
          content:
            apiGroups: ['']
            resources: ['nodes']
            verbs: ['get', 'list']

  - it: binds the cluster reader to marsa-api cluster-wide, since nodes are not namespaced
    template: templates/rbac.yml
    documentIndex: 4
    asserts:
      - isKind:
          of: ClusterRoleBinding
      - equal:
          path: metadata.name
          value: marsa-cluster-reader
      - equal:
          path: roleRef.name
          value: marsa-cluster-reader
      - contains:
          path: subjects
          content:
            kind: ServiceAccount
            name: marsa-api
            namespace: marsa
