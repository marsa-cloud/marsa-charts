# Chart Release — package the Marsa chart and push it to the ghcr.io OCI
# registry on a `v*` tag. Implements AgDR-0003 (OCI distribution on
# ghcr.io/marsa-cloud/charts; no gh-pages, no cr index, cosign deferred).
#
# Release flow: bump charts/marsa/Chart.yaml `version`, merge, then push a
# matching tag, e.g. `git tag v0.1.0 && git push origin v0.1.0`.

name: Chart Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

env:
  HELM_VERSION: "v3.17.3"

jobs:
  release:
    name: package + push chart
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Verify tag matches Chart.yaml version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          chart_ver="$(helm show chart charts/marsa | awk '/^version:/ {print $2}')"
          echo "tag=$tag chart_version=$chart_ver"
          if [ "$tag" != "$chart_ver" ]; then
            echo "::error::Tag v$tag does not match charts/marsa/Chart.yaml version $chart_ver. Bump the chart version or fix the tag."
            exit 1
          fi

      - name: Log in to ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Package chart
        run: helm package charts/marsa --destination .

      - name: Push to OCI registry
        run: |
          set -euo pipefail
          chart_ver="$(helm show chart charts/marsa | awk '/^version:/ {print $2}')"
          helm push "marsa-${chart_ver}.tgz" oci://ghcr.io/marsa-cloud/charts
          echo "Published oci://ghcr.io/marsa-cloud/charts/marsa:${chart_ver}"
